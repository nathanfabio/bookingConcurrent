name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    # Real services for the test suite. M0's tests don't need them yet, but
    # they're wired now so M1's real-Redis concurrency tests run in CI from
    # the first commit that adds them (CLAUDE.md §9: -race in CI, day one).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking-dev-password
          POSTGRES_DB: booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booking"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      REDIS_ADDR: localhost:6379
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking-dev-password
      POSTGRES_DB: booking_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: Repo hygiene guards
        run: bash scripts/lint-guards.sh

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The race detector is non-negotiable for this repo (CLAUDE.md §9):
      # the concurrency core is the point of the project.
      - name: Test with race detector
        run: go test -race ./...
