name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    # Real services for the test suite. M0's tests don't need them yet, but
    # they're wired now so M1's real-Redis concurrency tests run in CI from
    # the first commit that adds them (CLAUDE.md §9: -race in CI, day one).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking-dev-password
          POSTGRES_DB: booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booking"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      REDIS_ADDR: localhost:6379
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking-dev-password
      POSTGRES_DB: booking_test
      TEST_POSTGRES_DB: booking_test
      # Non-secret CI placeholders so config.Load() succeeds. The fake
      # payment provider is pinned: CI must stay physically incapable of
      # talking to a real gateway (CLAUDE.md §7).
      RABBITMQ_URL: amqp://ci:ci@localhost:5672/ci
      AUTH_JWT_SECRET: ci-placeholder-not-a-real-secret-000
      PAYMENT_PROVIDER: fake
      # Pinned CI value, not a secret: it only ever signs webhooks the CI
      # test run itself forges against the in-process fake gateway (ADR 0008).
      PAYMENT_FAKE_WEBHOOK_SECRET: ci-fake-webhook-secret-not-real-000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: Repo hygiene guards
        run: bash scripts/lint-guards.sh

      - name: sqlc check (generated code in sync with queries)
        run: make sqlc-check

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Migrations run as an EXPLICIT step in CI (CLAUDE.md §2): the
      # auto-migrate at boot is a dev-only convenience.
      - name: Apply migrations
        run: go run ./cmd/migrate up

      # The race detector is non-negotiable for this repo (CLAUDE.md §9):
      # the concurrency core is the point of the project.
      - name: Test with race detector
        run: go test -race ./...
