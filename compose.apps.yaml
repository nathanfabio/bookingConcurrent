# Optional overlay for running the packaged applications against local Compose.
x-app-env: &app-env
  ENV: production
  HTTP_ADDR: ":8080"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  REDIS_ADDR: redis:6379
  RABBITMQ_URL: amqp://booking:booking-dev-password@rabbitmq:5672/booking
  PAYMENT_PROVIDER: fake
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318

x-app: &app
  env_file: .env
  environment: *app-env
  read_only: true
  stop_grace_period: 30s

x-build: &build
  context: .
  dockerfile: docker/Dockerfile

services:
  migrate:
    <<: *app
    build: {<<: *build, target: migrate}
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *app
    build: {<<: *build, target: api}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    ports: ["127.0.0.1:${API_HOST_PORT:-8080}:8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 6
  worker:
    <<: *app
    environment:
      <<: *app-env
      SERVICE_NAME: booking-worker
    build: {<<: *build, target: worker}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
